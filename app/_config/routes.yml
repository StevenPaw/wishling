---
Name: app-routes
After:
  - '#rootroutes'
  - '#coreroutes'
---
SilverStripe\Control\Director:
  rules:
    # Frontend Routes
    'wishlist//$Action/$ID/$OtherID': 'App\Control\WishlistController'
    
    # API Routes
    'api/wishlist/$Action/$ID/$OtherID': 'App\Control\WishlistApiController'
    'api/test//$Action': 'App\Control\TestApiController'
    'api//$Action/$ID/$OtherID': 'App\Control\ApiController'
    
    # Home
    '': 'App\Control\HomeController'
