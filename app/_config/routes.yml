---
Name: app-routes
After:
  - '#rootroutes'
  - '#coreroutes'
---
SilverStripe\Control\Director:
  rules:
    # JSON-API
    'api/auth': 'App\Api\AuthApiController'
    'api/wishlists': 'App\Api\WishlistApiController'
    'api/wishes': 'App\Api\WishApiController'
    'api/public': 'App\Api\PublicApiController'

    # Vue-Frontend (SPA) – das Routing übernimmt der Vue Router
    '': 'App\Controllers\SpaController'
    'login//$@': 'App\Controllers\SpaController'
    'meine-listen//$@': 'App\Controllers\SpaController'
    'liste//$@': 'App\Controllers\SpaController'
    'profil//$@': 'App\Controllers\SpaController'
