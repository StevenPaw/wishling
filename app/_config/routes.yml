---
Name: app-routes
After:
  - '#rootroutes'
  - '#coreroutes'
---
SilverStripe\Control\Director:
  rules:
    # Frontend Routes
    'wishlist//$Action/$ID/$OtherID': 'App\Controllers\WishlistController'

    # API Routes
    'api//$Action/$ID/$OtherID': 'App\Controllers\ApiController'

    # Home
    '': 'App\Controllers\HomeController'
